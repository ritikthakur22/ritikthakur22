<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280" role="img" aria-label="eSkool: School and college ERP for staff, students and parents">
<style>
.nm { font: 800 21px "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #eafbff; }
.tg { font: 500 13.5px "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #9fb7c9; }
.ch { font: 600 12px "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #cfe9f5; }
.beam { stroke-dasharray: 110 964.2; animation: run 5s linear infinite; animation-delay: 0.0s; }
@keyframes run { to { stroke-dashoffset: -1074.2; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .beam { display: none; } .sc { opacity: 0; } .sc0 { opacity: 1; } }
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071022"/><stop offset="1" stop-color="#0b1d33"/></linearGradient>
<radialGradient id="sp" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#00b4d8" stop-opacity=".22"/><stop offset="1" stop-color="#00b4d8" stop-opacity="0"/></radialGradient>
<filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect x="1" y="1" width="278" height="278" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="278" height="278" rx="22" fill="url(#sp)"/>
<rect x="1" y="1" width="278" height="278" rx="22" fill="none" stroke="#1c3a57" stroke-width="1.5"/>
<rect class="beam" x="1" y="1" width="278" height="278" rx="22" fill="none" stroke="#00d9ff" stroke-width="4" stroke-linecap="round" filter="url(#gl)"/>
<rect class="beam" x="1" y="1" width="278" height="278" rx="22" fill="none" stroke="#bff4ff" stroke-width="1.6" stroke-linecap="round"/>
<clipPath id="ic"><rect x="96.0" y="28" width="88" height="88" rx="20"/></clipPath><g style="animation: float 3.6s ease-in-out infinite; animation-delay:0.0s"><image x="96.0" y="28" width="88" height="88" clip-path="url(#ic)" href="data:image/png;base64,"/></g>
<text x="140.0" y="150" text-anchor="middle" class="nm">eSkool</text>
<text x="140.0" y="178" text-anchor="middle" class="tg">School and college ERP for</text>
<text x="140.0" y="197" text-anchor="middle" class="tg">staff, students and parents</text>
<rect x="38.0" y="226" width="122.0" height="26" rx="13" fill="#0c1a2e" stroke="#1c3a57"/><text x="99.0" y="243" text-anchor="middle" class="ch">React Native</text><rect x="168.0" y="226" width="74.0" height="26" rx="13" fill="#0c1a2e" stroke="#1c3a57"/><text x="205.0" y="243" text-anchor="middle" class="ch">NestJS</text>
</svg>
