<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-label="Based in Nepal, open to remote work worldwide">
<style>
.h { font: 800 30px "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #eafbff; letter-spacing: -.5px; }
.m { font: 500 15px "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #8aa4b8; }
.k { font: 700 12px "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; letter-spacing: 2px; fill: #00b4d8; }
.lbl { font: 700 13px "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #eafbff; }
.tw { animation: tw 3s ease-in-out infinite; }
.flag { transform-box: view-box; animation: sway 2.4s ease-in-out infinite; }
.pin { animation: bob 2s ease-in-out infinite; }
.ring { transform-origin: 632px 152px; transform-box: view-box; animation: ping 2s ease-out infinite; }
.cloud { animation: drift 30s linear infinite alternate; } .c2 { animation-duration: 22s; animation-direction: alternate-reverse; }
@keyframes tw { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
@keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes ping { 0% { transform: scale(.4); opacity: .8; } 100% { transform: scale(2.2); opacity: 0; } }
@keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(60px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
